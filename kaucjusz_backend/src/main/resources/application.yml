spring:
  application:
    name: kaucjuszGo
    
  datasource:
    url: jdbc:postgresql://localhost:5433/kaucjusz_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
