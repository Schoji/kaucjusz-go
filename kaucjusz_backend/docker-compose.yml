services:
  postgres-postgis:
    image: postgis/postgis:16-3.4
    container_name: kaucjusz_db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=kaucjusz_db
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  kaucjusz-api:
    build: .
    container_name: kaucjusz_api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-postgis:5432/kaucjusz_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - FIREBASE_CONFIG_PATH=file:/app/firebase-service-account.json
    volumes:
      - ./src/main/resources/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      - postgres-postgis
    restart: unless-stopped

volumes:
  pgdata:
